[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phonehub"
version = "6.2.0"
description = "Modern Windows control center for a user's own Android device"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
