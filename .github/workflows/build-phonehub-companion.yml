name: Build PhoneHub Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/PhoneHubCompanion/**'
      - '.github/workflows/build-phonehub-companion.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android/PhoneHubCompanion
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHubCompanion-debug-apk
          path: android/PhoneHubCompanion/app/build/outputs/apk/debug/app-debug.apk
