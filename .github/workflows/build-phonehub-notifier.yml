name: Build PhoneHub Notifier APK

on:
  workflow_dispatch:
  push:
    paths:
      - "companion/PhoneHubNotifier/**"
      - ".github/workflows/build-phonehub-notifier.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p companion/PhoneHubNotifier assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp companion/PhoneHubNotifier/app/build/outputs/apk/debug/app-debug.apk PhoneHubNotifier.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHubNotifier
          path: PhoneHubNotifier.apk
          if-no-files-found: error
