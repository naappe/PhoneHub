name: Build PhoneHub Notifier APK

on:
  workflow_dispatch:
  push:
    paths:
      - "companion/PhoneHubNotifier/**"
      - ".github/workflows/build-phonehub-notifier.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read app version
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' companion/PhoneHubNotifier/app/build.gradle)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=PhoneHubNotifier-v$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p companion/PhoneHubNotifier clean assembleDebug

      - name: Verify Device Admin receiver is in merged manifest
        run: |
          grep -R "PhoneHubDeviceAdminReceiver" companion/PhoneHubNotifier/app/build/intermediates/merged_manifests companion/PhoneHubNotifier/app/build/intermediates/merged_manifest

      - name: Rename APK
        run: cp companion/PhoneHubNotifier/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHubNotifier-v${{ env.VERSION_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
