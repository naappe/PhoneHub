name: Build PhoneHub Link APK

on:
  workflow_dispatch:
  push:
    paths:
      - "companion/PhoneHubLink/**"
      - ".github/workflows/build-phonehub-link.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build PhoneHub Link
        run: gradle -p companion/PhoneHubLink clean assembleDebug

      - name: Rename APK
        run: cp companion/PhoneHubLink/app/build/outputs/apk/debug/app-debug.apk PhoneHubLink-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHubLink-v1.0
          path: PhoneHubLink-v1.0.apk
          if-no-files-found: error
