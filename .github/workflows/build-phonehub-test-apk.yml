name: Build PhoneHub Test APK

on:
  push:
    branches:
      - phonehub-android-spike
    paths:
      - 'android-test/**'
      - '.github/workflows/build-phonehub-test-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-test
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHub-Test-APK
          path: android-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
