name: PhoneHub Link Build

on:
  push:
    branches:
      - feature/phonehub-link-view-v0.1
    paths:
      - 'android-link/**'
      - 'viewer/**'
      - 'tests/test_viewer_file_mode.py'
      - '.github/workflows/phonehub-link-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install viewer test dependency
        run: python -m pip install pytest

      - name: Verify downloaded viewer file mode
        run: python -m pytest tests/test_viewer_file_mode.py -q

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle -p android-link :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android-link :app:assembleDebug --stacktrace

      - name: Prepare direct-download APK
        run: cp android-link/app/build/outputs/apk/debug/app-debug.apk PhoneHub-Link-v0.1-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHub-Link-v0.1-debug
          path: PhoneHub-Link-v0.1-debug.apk
          if-no-files-found: error

      - name: Upload browser viewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHub-Link-Viewer
          path: viewer/
          if-no-files-found: error

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=phonehub-link-v0.1-test
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${GITHUB_SHA}" \
              --title "PhoneHub Link v0.1 Test" \
              --notes "Test build for PhoneHub Link view-only cross-network screen sharing." \
              --prerelease
          fi
          gh release upload "$TAG" PhoneHub-Link-v0.1-debug.apk --clobber

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload viewer to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer

      - name: Deploy viewer website
        id: deployment
        uses: actions/deploy-pages@v4
