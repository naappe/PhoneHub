name: PhoneHub Link Build

on:
  push:
    branches:
      - feature/phonehub-link-view-v0.1
    paths:
      - 'android-link/**'
      - 'viewer/**'
      - '.github/workflows/phonehub-link-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle -p android-link :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android-link :app:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHub-Link-v0.1-debug
          path: android-link/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload browser viewer
        uses: actions/upload-artifact@v4
        with:
          name: PhoneHub-Link-Viewer
          path: viewer/
          if-no-files-found: error
