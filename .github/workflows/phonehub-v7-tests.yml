name: PhoneHub 7 Tests

on:
  push:
    branches:
      - feature/phonehub-v7-companion
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Python V7
        run: python -m compileall -q src/phonehub_v7

      - name: Compile Android Companion
        run: |
          chmod +x gradlew
          ./gradlew :companion:compileDebugKotlin
