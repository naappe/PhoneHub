name: Build PhoneHub 7 Companion

on:
  push:
    branches:
      - feature/phonehub-v7-companion
    paths:
      - "companion/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android-companion-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x gradlew
      - name: Restore stable signing key
        shell: python
        env:
          PHONEHUB_KEYSTORE_B64: ${{ secrets.PHONEHUB_KEYSTORE_B64 }}
        run: |
          import base64, os, pathlib
          raw = os.environ["PHONEHUB_KEYSTORE_B64"]
          clean = "".join(raw.split())
          pathlib.Path("companion/phonehub-release.jks").write_bytes(base64.b64decode(clean, validate=True))
      - name: Build signed Companion APK
        env:
          PHONEHUB_STORE_PASSWORD: ${{ secrets.PHONEHUB_STORE_PASSWORD }}
          PHONEHUB_KEY_ALIAS: ${{ secrets.PHONEHUB_KEY_ALIAS }}
          PHONEHUB_KEY_PASSWORD: ${{ secrets.PHONEHUB_KEY_PASSWORD }}
        run: ./gradlew :companion:assembleRelease
      - name: Collect APK
        run: |
          mkdir -p dist
          cp companion/build/outputs/apk/release/companion-release.apk dist/PhoneHub-Companion-7.0.0-dev3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneHub-Companion-7.0.0-dev3
          path: dist/PhoneHub-Companion-7.0.0-dev3.apk
          if-no-files-found: error
