name: PhoneHub Core Tests

on:
  push:
    paths:
      - 'PhoneHub.bat'
      - 'DIAGNOSE_PHONEHUB.bat'
      - 'app/PhoneHubCore.py'
      - 'app/core_runtime.py'
      - 'app/security_monitor.py'
      - 'tests/test_core_runtime.py'
      - 'tests/test_launcher_update.py'
      - '.github/workflows/phone-ip-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run core runtime tests
        run: python -m unittest tests.test_core_runtime -v

      - name: Run launcher tests
        run: python -m unittest tests.test_launcher_update -v

      - name: Compile PhoneHub v4 Python files
        run: python -m py_compile app/PhoneHubCore.py app/core_runtime.py app/security_monitor.py
