name: Build AndroidBridge Low Light Boost Server

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-nightvision-server.yml"
      - "tools/nightvision/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AndroidBridge
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Ensure Android 36 SDK
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Clone official scrcpy v4.1
        shell: bash
        run: |
          rm -rf scrcpy
          git clone --depth 1 --branch v4.1 https://github.com/Genymobile/scrcpy.git scrcpy

      - name: Apply AndroidBridge Low Light Boost patch
        run: python tools/nightvision/patch_scrcpy_llb.py

      - name: Build server only
        working-directory: scrcpy
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew :server:assembleRelease --no-daemon

      - name: Install custom server in AndroidBridge
        shell: bash
        run: |
          cp scrcpy/server/build/outputs/apk/release/server-release-unsigned.apk pc/scrcpy-server-v4.1-llb
          sha256sum pc/scrcpy-server-v4.1-llb > pc/scrcpy-server-v4.1-llb.sha256
          ls -lh pc/scrcpy-server-v4.1-llb

      - name: Commit custom server
        shell: bash
        run: |
          git config user.name "AndroidBridge Builder"
          git config user.email "actions@users.noreply.github.com"
          git add pc/scrcpy-server-v4.1-llb pc/scrcpy-server-v4.1-llb.sha256
          if git diff --cached --quiet; then
            echo "Server binary is already current."
          else
            git commit -m "Build AndroidBridge scrcpy v4.1 Low Light Boost server"
            git push
          fi
