<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PhoneHub Link Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel">
      <h1>PhoneHub Link</h1>
      <p>Live phone screen viewer</p>
      <label for="room">Room code</label>
      <input id="room" inputmode="numeric" maxlength="6" placeholder="123456">
      <button id="connect">Connect</button>
      <div id="status">Waiting for room code</div>
    </section>
    <section class="screen-wrap">
      <video id="screen" autoplay playsinline></video>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
